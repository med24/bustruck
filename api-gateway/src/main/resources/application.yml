server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000      # ms
        response-timeout: 10s
      routes:
        - id: ticket-service
          uri: ${TICKET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
        - id: ticket-service-docs      # Swagger UI / OpenAPI through the gateway
          uri: ${TICKET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
